services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pixeloffice
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  livekit:
      image: livekit/livekit-server:latest
      command: --dev
      ports:
        - "7880:7880" 
        - "7881:7881"
        - "7882:7882/udp"

volumes:
  pgdata: